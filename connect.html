<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hemant | Connect with me</title>
  <meta name="description" content="Connect with Hemant Malviya for podcast editing, video projects, and creative collaborations." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@200..500&family=Unbounded:wght@300..900&display=swap" rel="stylesheet" />

  <script>document.documentElement.classList.add("js")</script>
  <link rel="stylesheet" href="Style.css" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="connect.css" />
</head>
<body class="site-page" data-page="connect">
  <!-- Background, cursor, ruler, navigation and footer are added by site.js -->

  <main id="main">
    <section class="scene scene--cta connect" id="connect" data-label="Connect" data-c1="#FF8A1F" data-c2="#E5381C">
      <div class="connect__grid">

        <div class="connect__intro">
          <h1 class="cta__title connect__title" id="ctaTitle" aria-label="Let's connect">
            <span class="line" aria-hidden="true">Let's</span>
            <span class="line" aria-hidden="true">connect</span>
          </h1>
          <p class="body connect__lede">I'm open to podcast edits, freelance work and collaborations. Tell me what you're making and I'll reply by email.</p>
          <nav class="connect__links" aria-label="Direct links">
            <a class="roll" href="https://www.instagram.com/_vixvo/" target="_blank" rel="noopener" data-t="Instagram" aria-label="Instagram (opens in a new tab)"><span>Instagram</span></a>
            <a class="roll" href="https://www.linkedin.com/posts/hemant-malviya-82872825b_showreel2024-videoeditor-3d-activity-7282058799908110336-Cv-6/?utm_source=social_share_send&utm_medium=android_app&rcm=ACoAAEAAYKABEGWyuX9QHnmvgK_JB7vQSyrjb7Y&utm_campaign=whatsapp" target="_blank" rel="noopener" data-t="LinkedIn" aria-label="LinkedIn (opens in a new tab)"><span>LinkedIn</span></a>
          </nav>
        </div>

        <form id="connect-form" class="tile connect__card" novalidate>
          <div class="signal" id="signal" aria-hidden="true"></div>

          <fieldset class="topics">
            <legend>What's it about?</legend>
            <div class="topics__row">
              <button class="pill" type="button" aria-pressed="false" data-topic="Podcast edit">Podcast edit</button>
              <button class="pill" type="button" aria-pressed="false" data-topic="Trailer">Trailer</button>
              <button class="pill" type="button" aria-pressed="false" data-topic="Talking-head video">Talking-head video</button>
              <button class="pill" type="button" aria-pressed="false" data-topic="Something else">Something else</button>
            </div>
          </fieldset>

          <label class="fld"><span>Your name</span><input type="text" name="from_name" autocomplete="name" required /></label>
          <label class="fld"><span>Your email</span><input type="email" name="reply_to" autocomplete="email" required /></label>
          <label class="fld"><span>Your message</span><textarea name="message" rows="5" placeholder="What you're making, how long each episode is, when you need it." required></textarea></label>

          <div class="connect__send">
            <button class="btn-pill" type="submit" id="sendBtn" data-magnetic>Send message</button>
            <p id="form-status" class="connect__status" role="status" aria-live="polite"></p>
          </div>
        </form>

      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="site.js"></script>
  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script>emailjs.init("jG5ptJH_PKKwwMpBy");</script>
  <script src="connect.js"></script>
</body>
</html>
